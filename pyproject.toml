[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kordel-racing-data-lab"
version = "0.1.0"
description = "Pipeline local de dados da Fórmula 1 com arquitetura medalhão"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32,<3", "pandas>=2.2,<4", "pyarrow>=17,<24",
  "PyYAML>=6.0,<7", "streamlit>=1.40,<2", "plotly>=5.24,<7"
]

[project.scripts]
kordel-racing = "kordel_racing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
