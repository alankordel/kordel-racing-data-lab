name: Validação

on:
  push:
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Validar estilo
        run: ruff check .
      - name: Executar testes
        run: pytest --cov=src/kordel_racing --cov-report=term-missing

